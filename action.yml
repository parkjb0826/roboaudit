name: "RoboAudit"
description: "Health-check a LeRobot dataset and gate on its score: runs the roboaudit CLI and fails the job when the score is under --fail-under."
author: "RoboAudit"
inputs:
  dataset:
    description: "Dataset root folder (local path) or Hub repo-id"
    required: true
  fail-under:
    description: "Fail when the audit score is below this value (0-100). Leave empty to never gate on score."
    required: false
    default: ""
  out:
    description: "Output folder for report.html / result.json / report.md / badge.svg"
    required: false
    default: "roboaudit_out"
  max-episodes:
    description: "Audit only the first N episodes (sample audit). Leave empty for a full audit."
    required: false
    default: ""
  revision:
    description: "Hub revision (commit/tag/branch) to pin when dataset is a repo-id"
    required: false
    default: ""
  version:
    description: "RoboAudit version to install from PyPI"
    required: false
    default: "0.3.2"
outputs:
  score:
    description: "Audit score (0-100)"
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: "Audit grade (A-F)"
    value: ${{ steps.audit.outputs.grade }}
runs:
  using: "composite"
  steps:
    - name: Install RoboAudit
      shell: bash
      run: |
        python -m pip install --quiet "roboaudit[hub]==${{ inputs.version }}"
    - name: Audit dataset
      id: audit
      shell: bash
      run: |
        set +e
        args=(--out "${{ inputs.out }}" --markdown)
        if [ -n "${{ inputs.fail-under }}" ]; then
          args+=(--fail-under "${{ inputs.fail-under }}")
        fi
        if [ -n "${{ inputs.max-episodes }}" ]; then
          args+=(--max-episodes "${{ inputs.max-episodes }}")
        fi
        if [ -n "${{ inputs.revision }}" ]; then
          args+=(--revision "${{ inputs.revision }}")
        fi
        roboaudit "${{ inputs.dataset }}" "${args[@]}"
        rc=$?
        score=$(python -c "import json;print(json.load(open('${{ inputs.out }}/result.json'))['score'])")
        grade=$(python -c "import json;print(json.load(open('${{ inputs.out }}/result.json'))['grade'])")
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "grade=$grade" >> "$GITHUB_OUTPUT"
        echo "RoboAudit score: $score ($grade) — report in ${{ inputs.out }}/report.html"
        # Preserve RoboAudit exit-code semantics:
        # 0 complete, 1 score gate failed, 3 incomplete audit.
        exit $rc
branding:
  icon: "activity"
  color: "green"
