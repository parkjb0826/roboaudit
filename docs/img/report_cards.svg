<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="250" fill="#ffffff"/>

  <!-- Card 1: aloha -->
  <rect x="10" y="10" width="310" height="230" rx="10" fill="#f7fafc" stroke="#b6c2d2" stroke-width="1.5"/>
  <text x="30" y="42" font-size="15" font-weight="bold" fill="#1f3a5f">aloha transfer cube (sim)</text>
  <text x="30" y="62" font-size="12" fill="#4a5568">LeRobot v3.0 · 50 episodes</text>
  <text x="30" y="122" font-size="46" font-weight="bold" fill="#1f3a5f">79</text>
  <text x="102" y="122" font-size="15" fill="#4a5568">/ 100</text>
  <rect x="238" y="82" width="52" height="52" rx="10" fill="#d9930d"/>
  <text x="264" y="118" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">C</text>
  <text x="30" y="152" font-size="13" fill="#1f3a5f">Exclude <tspan font-weight="bold">0</tspan> · Review <tspan font-weight="bold">2</tspan></text>
  <line x1="30" y1="166" x2="300" y2="166" stroke="#b6c2d2"/>
  <text x="30" y="188" font-size="12.5" fill="#4a5568">Two episodes sit just past a range-band</text>
  <text x="30" y="206" font-size="12.5" fill="#4a5568">edge — sent to a human for review,</text>
  <text x="30" y="224" font-size="12.5" fill="#4a5568">not dropped automatically.</text>

  <!-- Card 2: battery -->
  <rect x="335" y="10" width="310" height="230" rx="10" fill="#f7fafc" stroke="#b6c2d2" stroke-width="1.5"/>
  <text x="355" y="42" font-size="15" font-weight="bold" fill="#1f3a5f">so100_battery</text>
  <text x="355" y="62" font-size="12" fill="#4a5568">LeRobot v2.1 · 50 episodes · 2 cameras</text>
  <text x="355" y="122" font-size="46" font-weight="bold" fill="#1f3a5f">84</text>
  <text x="427" y="122" font-size="15" fill="#4a5568">/ 100</text>
  <rect x="563" y="82" width="52" height="52" rx="10" fill="#1971c2"/>
  <text x="589" y="118" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">B</text>
  <text x="355" y="152" font-size="13" fill="#1f3a5f">Exclude <tspan font-weight="bold">0</tspan> · Review <tspan font-weight="bold">5</tspan></text>
  <line x1="355" y1="166" x2="625" y2="166" stroke="#b6c2d2"/>
  <text x="355" y="188" font-size="12.5" fill="#4a5568">Five “shake” flags look like busy</text>
  <text x="355" y="206" font-size="12.5" fill="#4a5568">episodes rather than camera shake —</text>
  <text x="355" y="224" font-size="12.5" fill="#4a5568">all review, none auto-dropped.</text>

  <!-- Card 3: sreetz -->
  <rect x="660" y="10" width="310" height="230" rx="10" fill="#f7fafc" stroke="#b6c2d2" stroke-width="1.5"/>
  <text x="680" y="42" font-size="15" font-weight="bold" fill="#1f3a5f">so101_teleop_vials (partial)</text>
  <text x="680" y="62" font-size="12" fill="#4a5568">LeRobot v3.0 · 75 episodes</text>
  <text x="680" y="122" font-size="46" font-weight="bold" fill="#1f3a5f">44</text>
  <text x="752" y="122" font-size="15" fill="#4a5568">/ 100</text>
  <rect x="888" y="82" width="52" height="52" rx="10" fill="#d64545"/>
  <text x="914" y="118" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">F</text>
  <rect x="680" y="132" width="138" height="20" rx="10" fill="#d64545"/>
  <text x="749" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">INCOMPLETE AUDIT</text>
  <text x="838" y="147" font-size="13" fill="#1f3a5f">Exclude <tspan font-weight="bold">7</tspan> · Review <tspan font-weight="bold">8</tspan></text>
  <line x1="680" y1="166" x2="950" y2="166" stroke="#b6c2d2"/>
  <text x="680" y="188" font-size="12.5" fill="#4a5568">Partial copy (166 MB): one camera is</text>
  <text x="680" y="206" font-size="12.5" fill="#4a5568">absent from this copy — the upstream</text>
  <text x="680" y="224" font-size="12.5" fill="#4a5568">dataset may be complete.</text>
</svg>
